name: learnai

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-learnai-admin-dev-only}
      LEARNAI_DB_USER: ${POSTGRES_USER:-learnai}
      LEARNAI_DB_PASSWORD: ${POSTGRES_PASSWORD:-learnai-dev-only}
      LEARNAI_DB_NAME: ${POSTGRES_DB:-learnai}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/01-create-app.sh:/docker-entrypoint-initdb.d/01-create-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learnai}:${POSTGRES_PASSWORD:-learnai-dev-only}@db:5432/${POSTGRES_DB:-learnai}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-this-development-jwt-secret-before-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      BACKEND_CORS_ORIGINS: '["${FRONTEND_ORIGIN:-http://localhost:3000}"]'
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
    volumes:
      - document_uploads:/app/storage/documents
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  document_uploads:
