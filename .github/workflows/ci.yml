name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://learnai:learnai-ci-only@localhost:5432/learnai
      JWT_SECRET_KEY: ci-only-jwt-secret-that-is-at-least-thirty-two-characters
      RUN_POSTGRES_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - name: Create non-superuser application database
        env:
          PG_ADMIN_URL: postgresql://postgres:postgres-ci-only@localhost:5432/postgres
          PG_ADMIN_APP_DB_URL: postgresql://postgres:postgres-ci-only@localhost:5432/learnai
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["PG_ADMIN_URL"], autocommit=True) as connection:
              connection.execute(
                  "CREATE ROLE learnai LOGIN PASSWORD 'learnai-ci-only' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE"
              )
              connection.execute("CREATE DATABASE learnai OWNER learnai")

          with psycopg.connect(
              os.environ["PG_ADMIN_APP_DB_URL"],
              autocommit=True,
          ) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - run: alembic upgrade head
      - run: alembic current
      - run: python -m pytest -q tests/test_semantic_search_postgres.py tests/test_quiz_postgres.py tests/test_analytics_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: npm audit --audit-level=high
